<!DOCTYPE html>
<html>
<head>
    <title>Random Noises</title>
</head>

<body>

    <button id="playButton">Play</button>

    <script>
        const noises = [
            "audio/noise1.mp3",
            "audio/noise2.mp3",
            "audio/noise3.mp3",
            "audio/noise4.mp3",
            "audio/noise5.mp3"
        ];

        document.getElementById("playButton").addEventListener("click", function() {

            // Make a copy so we can shuffle it
            let shuffled = [...noises];

            // Shuffle the five noises
            shuffled.sort(() => Math.random() - 0.5);

            // Play them one after another
            let index = 0;

            function playNext() {
                if (index >= shuffled.length) {
                    return;
                }

                const audio = new Audio(shuffled[index]);
                index++;

                audio.addEventListener("ended", playNext);
                audio.play();
            }

            playNext();
        });
    </script>

</body>
</html>
